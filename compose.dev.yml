# Hanzo Stack - Development Compose
# Builds all services from local source code with hot reload

services:
  # Core Infrastructure (using same images as production)
  postgres:
    image: postgres:16-alpine
    container_name: hanzo-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hanzo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hanzo123}
      - POSTGRES_DB=${POSTGRES_DB:-hanzo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hanzo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  redis:
    image: redis:7-alpine
    container_name: hanzo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-hanzo123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hanzo123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  mongodb:
    image: mongo:7
    container_name: hanzo-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-hanzo}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-hanzo123}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-hanzo}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  minio:
    image: minio/minio:latest
    container_name: hanzo-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: hanzo-meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-hanzo-meili-master}
      - MEILI_ENV=${MEILI_ENV:-development}
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network
  
  # Hanzo Router (LLM Gateway) - Development mode
  router:
    build:
      context: ../llm
      dockerfile: Dockerfile
      target: development
    environment:
      - ROUTER_MODE=DEVELOPMENT
      - DEBUG=true
      - LOG_LEVEL=debug
    volumes:
      # Mount source code for hot reload
      - ../llm/litellm_proxy:/app/litellm_proxy:rw
      - ../llm/utils:/app/utils:rw
      - ../llm/litellm:/app/litellm:rw
      # Mount config files
      - ./config/router-config.yaml:/app/config.yaml:ro
      - ./config/router-extensions.py:/app/extensions.py:ro
      # Persist logs
      - ./logs/router:/app/logs:rw
    command: ["--config", "/app/config.yaml", "--port", "4000", "--debug"]

  # Hanzo Chat - Development mode (LiteLLM Proxy)
  chat:
    build:
      context: ../chat
      dockerfile: Dockerfile.dev
    container_name: hanzo-chat
    ports:
      - "${CHAT_PORT:-3081}:4000"
    environment:
      - NODE_ENV=development
      - LITELLM_MODE=DEVELOPMENT
      - LITELLM_MASTER_KEY=${ROUTER_MASTER_KEY:-sk-router-master-hanzo}
      - UI_USERNAME=${ROUTER_UI_USERNAME:-admin}
      - UI_PASSWORD=${ROUTER_UI_PASSWORD:-admin}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/${POSTGRES_DB:-hanzo}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source code for hot reload
      - ../chat:/app:rw
      - ./config/litellm-config.yaml:/app/config.yaml:ro
      # Persist logs
      - ./logs/chat:/app/logs:rw
    command: ["python", "-m", "litellm", "--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hanzo-network

  # Hanzo Cloud - Development mode
  cloud:
    build:
      context: ../cloud
      dockerfile: Dockerfile
      target: development
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Mount source code
      - ../cloud:/app:rw
      - /app/node_modules
      - /app/.next
      # Mount workspace packages
      - ../cloud/packages:/app/packages:rw
      - ../cloud/apps:/app/apps:rw
    command: ["pnpm", "dev"]

  # Hanzo Search - Development mode
  search:
    build:
      context: ../search
      dockerfile: Dockerfile
      target: development
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Mount source code
      - ../search:/app:rw
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]

  # Hanzo Build - Development mode (OpenHands)
  build:
    build:
      context: ../dev
      dockerfile: containers/app/Dockerfile
      target: development
    container_name: hanzo-build
    ports:
      - "${BUILD_PORT:-3002}:3000"
    environment:
      - NODE_ENV=development
      - WORKSPACE_MOUNT_PATH=/workspace
      - SANDBOX_USER_ID=1000
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ubuntu:22.04
      - USE_HOST_NETWORK=false
      - SSH_HOSTNAME=localhost
      - DISABLE_TELEM=true
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      # Mount source code
      - ../build:/app:rw
      - build_workspace:/workspace
      - /app/venv
      - /app/frontend/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["make", "run"]
    networks:
      - hanzo-network

  # Hanzo Runtime - Development mode
  runtime:
    build:
      context: ../runtime
      dockerfile: Dockerfile.runtime
      target: development
    environment:
      - NODE_ENV=development
      - DEBUG=true
      - LOG_LEVEL=debug
      # Additional development environment variables
      - WATCH_MODE=true
      - HOT_RELOAD=true
    volumes:
      # Mount source code for hot reload
      - ../runtime:/app:rw
      - /app/node_modules
      - /app/dist
      # Mount apps source
      - ../runtime/apps:/app/apps:rw
      - ../runtime/libs:/app/libs:rw
      # Persist development data
      - ./data/runtime:/app/data:rw
      - ./logs/runtime:/app/logs:rw
    command: ["pnpm", "nx", "serve", "api", "--watch"]
    networks:
      - hanzo-network

  # Add development tools
  adminer:
    image: adminer:latest
    container_name: hanzo-adminer
    ports:
      - "8080:8080"
    networks:
      - hanzo-network
    depends_on:
      - postgres
    profiles:
      - tools

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: hanzo-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-hanzo123}
    ports:
      - "8081:8081"
    networks:
      - hanzo-network
    depends_on:
      - redis
    profiles:
      - tools

  mongo-express:
    image: mongo-express:latest
    container_name: hanzo-mongo-express
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USERNAME:-hanzo}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD:-hanzo123}
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    ports:
      - "8082:8081"
    networks:
      - hanzo-network
    depends_on:
      - mongodb
    profiles:
      - tools

  # Hanzo IAM - Development mode
  iam:
    build:
      context: ../iam
      dockerfile: Dockerfile.develop
    environment:
      - RUNNING_IN_DOCKER=true
      - DEBUG=true
      - driverName=postgres
      - dataSourceName=user=${POSTGRES_USER:-hanzo} password=${POSTGRES_PASSWORD:-hanzo123} host=postgres port=5432 sslmode=disable dbname=iam
    volumes:
      # Mount source code for hot reload
      - ../iam:/go/src/casdoor:rw
      - ../iam/web:/web:rw
      - iam_data:/conf
    command: ["/go/src/casdoor/server"]

# Additional volumes for development
volumes:
  # Database volumes
  postgres_data:
  redis_data:
  mongodb_data:
  minio_data:
  meilisearch_data:
  
  # Log volumes
  router_logs:
  chat_logs:
  cloud_logs:
  search_logs:
  build_logs:
  runtime_logs:
  
  # Data volumes
  chat_uploads:
  build_workspace:
  iam_data:

# Ensure we use the same network
networks:
  hanzo-network:
    name: hanzo-network
    external: true