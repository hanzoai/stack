#+ Hanzo Stack - Development Compose (from submodules in stack/)

services:
  # Core Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: hanzo-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hanzo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hanzo123}
      - POSTGRES_DB=${POSTGRES_DB:-hanzo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hanzo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  redis:
    image: redis:7-alpine
    container_name: hanzo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-hanzo123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hanzo123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  mongodb:
    image: mongo:7
    container_name: hanzo-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-hanzo}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-hanzo123}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-hanzo}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  minio:
    image: minio/minio:latest
    container_name: hanzo-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: hanzo-meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-hanzo-meili-master}
      - MEILI_ENV=${MEILI_ENV:-development}
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  # Router (LLM Gateway) from submodule
  router:
    build:
      context: services/llm
      dockerfile: Dockerfile
      target: development
    container_name: hanzo-router
    environment:
      - ROUTER_MODE=DEVELOPMENT
      - DEBUG=true
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/${POSTGRES_DB:-hanzo}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-hanzo123}@redis:6379
      - MASTER_KEY=${ROUTER_MASTER_KEY:-sk-router-master-hanzo}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - services/llm:/app:rw
      - ./config/router-config.yaml:/app/config.yaml:ro
      - ./config/router-extensions.py:/app/extensions.py:ro
      - ./logs/router:/app/logs:rw
    command: ["--config", "/app/config.yaml", "--port", "4000", "--debug"]
    ports:
      - "${ROUTER_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hanzo-network

  # Chat from submodule
  chat:
    build:
      context: services/chat
      dockerfile: Dockerfile.dev
    container_name: hanzo-chat
    environment:
      - NODE_ENV=development
      - LLM_MODE=DEVELOPMENT
      - LLM_MASTER_KEY=${ROUTER_MASTER_KEY:-sk-router-master-hanzo}
      - UI_USERNAME=${ROUTER_UI_USERNAME:-admin}
      - UI_PASSWORD=${ROUTER_UI_PASSWORD:-admin}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/${POSTGRES_DB:-hanzo}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - services/chat:/app:rw
      - ./config/litellm-config.yaml:/app/config.yaml:ro
      - ./logs/chat:/app/logs:rw
    command: ["python", "-m", "litellm", "--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    ports:
      - "${CHAT_PORT:-3081}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hanzo-network

  # Cloud (Next.js) from submodule
  cloud:
    build:
      context: cloud
      dockerfile: Dockerfile
      target: development
    container_name: hanzo-cloud
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - cloud:/app:rw
      - /app/node_modules
      - /app/.next
    command: ["pnpm", "dev"]
    ports:
      - "${CLOUD_PORT:-3001}:3000"
    networks:
      - hanzo-network

  # Search from submodule
  search:
    build:
      context: services/search
      dockerfile: Dockerfile
      target: development
    container_name: hanzo-search
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - services/search:/app:rw
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    ports:
      - "${SEARCH_PORT:-3000}:3000"
    networks:
      - hanzo-network

  # Runtime from submodule
  runtime:
    build:
      context: runtime
      dockerfile: Dockerfile.runtime
      target: development
    container_name: hanzo-runtime
    environment:
      - NODE_ENV=development
      - DEBUG=true
      - LOG_LEVEL=debug
      - WATCH_MODE=true
      - HOT_RELOAD=true
    volumes:
      - runtime:/app:rw
      - /app/node_modules
      - /app/dist
      - ./data/runtime:/app/data:rw
      - ./logs/runtime:/app/logs:rw
    command: ["pnpm", "nx", "serve", "api", "--watch"]
    ports:
      - "${RUNTIME_PORT:-3003}:8080"
    networks:
      - hanzo-network

  # IAM from submodule
  iam:
    build:
      context: iam
      dockerfile: Dockerfile.develop
    container_name: hanzo-iam
    environment:
      - RUNNING_IN_DOCKER=true
      - DEBUG=true
      - driverName=postgres
      - dataSourceName=user=${POSTGRES_USER:-hanzo} password=${POSTGRES_PASSWORD:-hanzo123} host=postgres port=5432 sslmode=disable dbname=iam
    volumes:
      - iam:/go/src/casdoor:rw
      - iam/web:/web:rw
      - iam_data:/conf
    command: ["/go/src/casdoor/server"]
    ports:
      - "${IAM_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hanzo-network

  # Dev Tools (profiles)
  adminer:
    image: adminer:latest
    container_name: hanzo-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - hanzo-network
    profiles:
      - tools

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: hanzo-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-hanzo123}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - hanzo-network
    profiles:
      - tools

  mongo-express:
    image: mongo-express:latest
    container_name: hanzo-mongo-express
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USERNAME:-hanzo}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASSWORD:-hanzo123}
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    ports:
      - "8082:8081"
    depends_on:
      - mongodb
    networks:
      - hanzo-network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  minio_data:
  meilisearch_data:
  chat_uploads:
  iam_data:

networks:
  hanzo-network:
    driver: bridge
