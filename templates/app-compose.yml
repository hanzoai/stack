# Hanzo Stack - App Template
# Copy this file to your app directory and customize
#
# Usage:
#   1. Copy to your app: cp templates/app-compose.yml ~/myapp/compose.yml
#   2. Edit service name, image, ports, environment
#   3. Run: docker compose up -d
#
# Your app will automatically:
#   - Connect to shared infrastructure (postgres, redis, minio, etc.)
#   - Have logs collected by Promtail → Loki → Grafana
#   - Be routable via Platform's subdomain routing

services:
  myapp:
    image: ghcr.io/yourorg/myapp:latest
    # Or build locally:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: hanzo-myapp
    environment:
      # Database - create your DB first: createdb hanzo_myapp
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/hanzo_myapp

      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:-hanzo123}@redis:6379

      # S3/MinIO
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_BUCKET=myapp

      # LLM Gateway (if your app uses AI)
      - LLM_API_URL=http://router:4000/v1
      - LLM_API_KEY=${ROUTER_MASTER_KEY:-sk-router-master-hanzo}

      # NATS for async jobs/events
      - NATS_URL=nats://nats:4222

      # Search
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY:-masterKey}

      # Your app config
      - NODE_ENV=production
      - PORT=8080

    ports:
      # Expose for direct access during development
      # In production, Platform handles routing
      - "8088:8080"

    # Health check - adjust to your app's health endpoint
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Logging - stdout/stderr automatically goes to Loki via Promtail
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service,environment"

    labels:
      # These labels help Promtail categorize your logs
      - "service=myapp"
      - "environment=production"

      # If using Traefik directly (optional)
      # - "traefik.enable=true"
      # - "traefik.http.routers.myapp.rule=Host(`myapp.hanzo.local`)"
      # - "traefik.http.services.myapp.loadbalancer.server.port=8080"

    networks:
      - hanzo-network

# Join the shared Hanzo network
networks:
  hanzo-network:
    external: true
