# Hanzo Core Stack - 7 Essential Services
# Deploy with: docker compose -f compose.core.yml up -d
#
# Services:
#   1. analytics  - Umami fork - Web analytics (port 3010)
#   2. datastore  - Hanzo Datastore - Analytics data warehouse (port 8123)
#   3. base       - PocketBase fork - BaaS with auth & realtime (port 8090)
#   4. iam        - Casdoor fork - Identity & access management (port 8000)
#   5. kms        - Infisical fork - Secrets management (port 8070)
#   6. commerce   - Hanzo Commerce - E-commerce platform (port 8001)
#   7. marketing  - AI Marketing - Campaign automation (port 8002)

services:
  # =============================================================================
  # INFRASTRUCTURE
  # =============================================================================

  postgres:
    image: ghcr.io/hanzoai/sql:17-alpine
    container_name: hanzo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hanzo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hanzo123}
      POSTGRES_DB: ${POSTGRES_DB:-hanzo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hanzo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  redis:
    image: ghcr.io/hanzoai/kv:latest
    container_name: hanzo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-hanzo123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hanzo123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  nats:
    image: nats:2.10-alpine
    container_name: hanzo-nats
    restart: unless-stopped
    command:
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_HTTP_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  # =============================================================================
  # 1. ANALYTICS - Umami Fork (Web Analytics)
  # =============================================================================

  analytics:
    image: ghcr.io/hanzoai/analytics:latest
    container_name: hanzo-analytics
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/${POSTGRES_DB:-hanzo}_analytics
      DATASTORE_URL: http://datastore:8123
      DATASTORE_DB: ${DATASTORE_DB:-analytics}
      DATASTORE_USER: ${DATASTORE_USER:-hanzo}
      DATASTORE_PASSWORD: ${DATASTORE_PASSWORD:-hanzo123}
      NEXTAUTH_URL: ${ANALYTICS_URL:-http://localhost:3010}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-analytics-secret-change-me}
      APP_SECRET: ${ANALYTICS_SECRET:-analytics-app-secret}
      DISABLE_SIGNUPS: ${ANALYTICS_DISABLE_SIGNUPS:-false}
      DISABLE_TELEMETRY: "1"
    ports:
      - "${ANALYTICS_PORT:-3010}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      datastore:
        condition: service_healthy
    networks:
      - hanzo-network

  # =============================================================================
  # 2. DATASTORE - Hanzo Datastore (Analytics Data Warehouse)
  # =============================================================================

  datastore:
    image: hanzoai/datastore-server:latest
    container_name: hanzo-datastore
    restart: unless-stopped
    environment:
      DATASTORE_DB: ${DATASTORE_DB:-analytics}
      DATASTORE_USER: ${DATASTORE_USER:-hanzo}
      DATASTORE_PASSWORD: ${DATASTORE_PASSWORD:-hanzo123}
      DATASTORE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - datastore_data:/var/lib/hanzo-datastore
      - datastore_logs:/var/log/hanzo-datastore-server
    ports:
      - "${DATASTORE_HTTP_PORT:-8123}:8123"
      - "${DATASTORE_NATIVE_PORT:-9009}:9000"
    healthcheck:
      test: ["CMD", "hanzo-datastore-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - hanzo-network

  # =============================================================================
  # 3. BASE - PocketBase Fork (Backend-as-a-Service)
  # =============================================================================

  base:
    image: ghcr.io/hanzoai/base:latest
    build:
      context: ../../base
      dockerfile: Dockerfile
    container_name: hanzo-base
    restart: unless-stopped
    environment:
      PB_ENCRYPTION_KEY: ${BASE_ENCRYPTION_KEY:-32-char-encryption-key-here!!}
    volumes:
      - base_data:/pb_data
      - base_migrations:/pb_migrations
    ports:
      - "${BASE_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  # =============================================================================
  # 4. IAM - Casdoor Fork (Identity & Access Management)
  # =============================================================================

  iam:
    image: ghcr.io/hanzoai/iam:latest
    container_name: hanzo-iam
    restart: unless-stopped
    environment:
      driverName: postgres
      dataSourceName: "user=${POSTGRES_USER:-hanzo} password=${POSTGRES_PASSWORD:-hanzo123} host=postgres port=5432 sslmode=disable dbname=${POSTGRES_DB:-hanzo}_iam"
      appname: Hanzo IAM
      httpport: "8000"
      runmode: ${IAM_MODE:-prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-hanzo123}@redis:6379
    ports:
      - "${IAM_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  # =============================================================================
  # 5. KMS - Infisical Fork (Secrets Management)
  # =============================================================================

  kms:
    image: ghcr.io/hanzoai/kms:latest
    build:
      context: ../kms
      dockerfile: Dockerfile.standalone-infisical
    container_name: hanzo-kms
    restart: unless-stopped
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${KMS_ENCRYPTION_KEY:-6de33a4e5d9c57cf9e41b7147a0aff04}
      AUTH_SECRET: ${KMS_AUTH_SECRET:-kms-auth-secret-change-me-now!}
      DB_CONNECTION_URI: postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/${POSTGRES_DB:-hanzo}_kms
      REDIS_URL: redis://:${REDIS_PASSWORD:-hanzo123}@redis:6379
      SITE_URL: ${KMS_URL:-http://localhost:8070}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Hanzo KMS}
      TELEMETRY_ENABLED: "false"
    ports:
      - "${KMS_PORT:-8070}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  # =============================================================================
  # 6. COMMERCE - Hanzo Commerce (E-commerce Platform)
  # =============================================================================

  commerce:
    image: ghcr.io/hanzoai/commerce:latest
    build:
      context: ../../commerce
      dockerfile: Dockerfile
    container_name: hanzo-commerce
    restart: unless-stopped
    environment:
      # Database
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/${POSTGRES_DB:-hanzo}_commerce
      REDIS_URL: redis://:${REDIS_PASSWORD:-hanzo123}@redis:6379
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # PayPal
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      # Email
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@hanzo.ai}
      # General
      APP_ENV: ${APP_ENV:-production}
      PORT: "8001"
      # IAM Integration
      IAM_URL: http://iam:8000
      # Analytics
      ANALYTICS_URL: http://analytics:3000
      DATASTORE_URL: http://datastore:8123
    ports:
      - "${COMMERCE_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      iam:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  # =============================================================================
  # 7. MARKETING - AI Marketing Automation
  # =============================================================================

  marketing:
    image: ghcr.io/hanzoai/marketing:latest
    build:
      context: ../../marketing
      dockerfile: Dockerfile
    container_name: hanzo-marketing
    restart: unless-stopped
    environment:
      # Hanzo Stack
      MARKETING_ROUTER_URL: ${ROUTER_URL:-http://router:4000/v1}
      MARKETING_ROUTER_API_KEY: ${ROUTER_API_KEY:-sk-router-master-hanzo}
      MARKETING_DATASTORE_URL: http://datastore:8123
      MARKETING_REDIS_URL: redis://:${REDIS_PASSWORD:-hanzo123}@redis:6379
      MARKETING_NATS_URL: nats://nats:4222
      # Ad Platforms
      MARKETING_META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      MARKETING_META_APP_SECRET: ${META_APP_SECRET:-}
      MARKETING_GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      MARKETING_GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      MARKETING_GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      MARKETING_GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      MARKETING_TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      MARKETING_TIKTOK_APP_ID: ${TIKTOK_APP_ID:-}
      # Email/SMS
      MARKETING_SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MARKETING_TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      MARKETING_TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      MARKETING_TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      # Social
      MARKETING_TWITTER_API_KEY: ${TWITTER_API_KEY:-}
      MARKETING_TWITTER_API_SECRET: ${TWITTER_API_SECRET:-}
      MARKETING_TWITTER_ACCESS_TOKEN: ${TWITTER_ACCESS_TOKEN:-}
      MARKETING_TWITTER_ACCESS_SECRET: ${TWITTER_ACCESS_SECRET:-}
      MARKETING_LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      MARKETING_LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      # Service Config
      MARKETING_HOST: "0.0.0.0"
      MARKETING_PORT: "8001"
      MARKETING_DEBUG: ${DEBUG:-false}
    ports:
      - "${MARKETING_PORT:-8002}:8001"
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      datastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hanzo-network

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
    name: hanzo-postgres-data
  redis_data:
    name: hanzo-redis-data
  nats_data:
    name: hanzo-nats-data
  datastore_data:
    name: hanzo-datastore-data
  datastore_logs:
    name: hanzo-datastore-logs
  base_data:
    name: hanzo-base-data
  base_migrations:
    name: hanzo-base-migrations

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  hanzo-network:
    name: hanzo-network
    driver: bridge
