# Hanzo Stack - Infrastructure Only
# Basic infrastructure services that are available from Docker Hub

services:
  # Core Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: hanzo-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hanzo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hanzo123}
      - POSTGRES_DB=${POSTGRES_DB:-hanzo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hanzo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  redis:
    image: redis:7-alpine
    container_name: hanzo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-hanzo123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hanzo123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  mongodb:
    image: mongo:7
    container_name: hanzo-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-hanzo}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-hanzo123}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-hanzo}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  minio:
    image: minio/minio:latest
    container_name: hanzo-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: hanzo-meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-hanzo-meili-master}
      - MEILI_ENV=${MEILI_ENV:-development}
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

# Volumes
volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  minio_data:
  meilisearch_data:

# Network
networks:
  hanzo-network:
    name: hanzo-network
    external: true
