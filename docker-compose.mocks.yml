version: '3.8'

# Mock external services for testing
services:
  # Mock OpenAI API
  mock-openai:
    image: mockserver/mockserver:latest
    ports:
      - "8080:1080"
    environment:
      - MOCKSERVER_PROPERTY_FILE=/config/mockserver.properties
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/openai-mocks.json
    volumes:
      - ./mocks/config/mockserver.properties:/config/mockserver.properties
      - ./mocks/config/openai-mocks.json:/config/openai-mocks.json
    networks:
      - hanzo
      
  # Mock Anthropic API
  mock-anthropic:
    image: mockserver/mockserver:latest
    ports:
      - "8081:1080"
    environment:
      - MOCKSERVER_INITIALIZATION_JSON_PATH=/config/anthropic-mocks.json
    volumes:
      - ./mocks/config/anthropic-mocks.json:/config/anthropic-mocks.json
    networks:
      - hanzo
      
  # Mock Stripe API
  mock-stripe:
    image: stripe/stripe-mock:latest
    ports:
      - "8082:12111"
    networks:
      - hanzo
      
  # Mock OAuth providers (GitHub, Google, etc.)
  mock-oauth:
    build:
      context: ./mocks/oauth
    ports:
      - "8083:8080"
    environment:
      - MOCK_PROVIDER=all
      - AUTO_APPROVE=true
      - DEFAULT_USER_EMAIL=test@hanzo.ai
      - DEFAULT_USER_NAME=Test User
    networks:
      - hanzo
      
  # Mock S3 (for testing without MinIO)
  mock-s3:
    image: adobe/s3mock:latest
    ports:
      - "9090:9090"
    environment:
      - initialBuckets=test-bucket
      - root=/s3mockroot
    networks:
      - hanzo
      
  # Mock email service
  mock-smtp:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - hanzo
      
  # Mock webhook receiver
  mock-webhooks:
    image: tarampampam/webhook-tester:latest
    ports:
      - "8084:8080"
    environment:
      - STORAGE_DRIVER=memory
      - MAX_REQUESTS=1000
    networks:
      - hanzo
      
  # Mock rate limiter response
  mock-rate-limiter:
    build:
      context: ./mocks/rate-limiter
    ports:
      - "8085:8080"
    environment:
      - DEFAULT_RATE_LIMIT=100
      - RATE_LIMIT_WINDOW=60
    networks:
      - hanzo
      
  # Mock external APIs aggregator
  mock-api-gateway:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./mocks/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./mocks/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - hanzo
    depends_on:
      - mock-openai
      - mock-anthropic
      - mock-stripe
      - mock-oauth