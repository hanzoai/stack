server {
    listen 80;
    server_name flow.localhost;

    # Proxy to the Flow service
    location / {
        proxy_pass http://flow:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject analytics script into HTML responses
        sub_filter '</head>' '<script async defer data-website-id="flow-hanzo-ai" src="https://a.hanzo.ai/hanzo.js" data-host-url="https://a.hanzo.ai"></script></head>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://flow:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}