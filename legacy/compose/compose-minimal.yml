# Hanzo Stack - Minimal Configuration
# Start with core services only

services:
  # Core Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: hanzo-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hanzo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hanzo123}
      - POSTGRES_DB=${POSTGRES_DB:-hanzo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hanzo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  redis:
    image: redis:7-alpine
    container_name: hanzo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-hanzo123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hanzo123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  mongodb:
    image: mongo:7
    container_name: hanzo-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-hanzo}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-hanzo123}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-hanzo}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

# Persistent Volumes
volumes:
  postgres_data:
  redis_data:
  mongodb_data:

# Network
networks:
  hanzo-network:
    name: hanzo-network
    driver: bridge