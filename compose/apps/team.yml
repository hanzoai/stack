# Hanzo Team - Project Management Platform
# Based on Huly platform (EPL-2.0)
# https://github.com/hanzoai/team

services:
  # Infrastructure for Team
  team-mongodb:
    image: mongo:7-jammy
    container_name: hanzo-team-mongodb
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - team_mongodb_data:/data/db
    networks:
      - team-network
    restart: unless-stopped

  team-minio:
    image: minio/minio
    container_name: hanzo-team-minio
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - team_minio_data:/data
    networks:
      - team-network
    restart: unless-stopped

  team-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.1
    container_name: hanzo-team-redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr internal://team-redpanda:9092,external://localhost:29092
    volumes:
      - team_redpanda_data:/var/lib/redpanda/data
    networks:
      - team-network
    restart: unless-stopped

  # Team - Transactor Service
  team-transactor:
    image: hanzoai/team-transactor:${TEAM_VERSION:-latest}
    container_name: hanzo-team-transactor
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${TEAM_SECRET:-team-secret-key}
      - SERVER_CURSOR_MAXTIMEMS=30000
      - DB_URL=mongodb://team-mongodb:27017
      - MONGO_URL=mongodb://team-mongodb:27017
      - STORAGE_CONFIG=minio|team-minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - FRONT_URL=http://localhost:${TEAM_PORT:-8087}
      - ACCOUNTS_URL=http://team-account:3000
      - FULLTEXT_URL=http://team-fulltext:4700
      - STATS_URL=http://team-stats:4900
      - LAST_NAME_FIRST=${TEAM_LAST_NAME_FIRST:-false}
      - PROCEED_V7_MONGO=true
      - QUEUE_CONFIG=team-redpanda:9092
    depends_on:
      - team-mongodb
      - team-minio
      - team-redpanda
    networks:
      - team-network
    restart: unless-stopped

  # Team - Account Service
  team-account:
    image: hanzoai/team-account:${TEAM_VERSION:-latest}
    container_name: hanzo-team-account
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${TEAM_SECRET:-team-secret-key}
      - DB_URL=mongodb://team-mongodb:27017
      - MONGO_URL=mongodb://team-mongodb:27017
      - TRANSACTOR_URL=ws://team-transactor:3333
      - STORAGE_CONFIG=minio|team-minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - FRONT_URL=http://team-front:8080
      - STATS_URL=http://team-stats:4900
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://localhost:3000
      - ACCOUNT_PORT=3000
      - PROCEED_V7_MONGO=true
    depends_on:
      - team-mongodb
      - team-transactor
    networks:
      - team-network
    restart: unless-stopped

  # Team - Collaborator Service
  team-collaborator:
    image: hanzoai/team-collaborator:${TEAM_VERSION:-latest}
    container_name: hanzo-team-collaborator
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${TEAM_SECRET:-team-secret-key}
      - ACCOUNTS_URL=http://team-account:3000
      - DB_URL=mongodb://team-mongodb:27017
      - STATS_URL=http://team-stats:4900
      - STORAGE_CONFIG=minio|team-minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      - team-mongodb
      - team-account
    networks:
      - team-network
    restart: unless-stopped

  # Team - Workspace Service
  team-workspace:
    image: hanzoai/team-workspace:${TEAM_VERSION:-latest}
    container_name: hanzo-team-workspace
    environment:
      - SERVER_SECRET=${TEAM_SECRET:-team-secret-key}
      - DB_URL=mongodb://team-mongodb:27017
      - MONGO_URL=mongodb://team-mongodb:27017
      - ACCOUNTS_DB_URL=mongodb://team-mongodb:27017
      - TRANSACTOR_URL=ws://team-transactor:3333
      - STORAGE_CONFIG=minio|team-minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://team-account:3000
      - STATS_URL=http://team-stats:4900
      - PROCEED_V7_MONGO=true
      - QUEUE_CONFIG=team-redpanda:9092
    depends_on:
      - team-account
      - team-redpanda
      - team-transactor
    networks:
      - team-network
    restart: unless-stopped

  # Team - Full-text Search Service
  team-fulltext:
    image: hanzoai/team-fulltext:${TEAM_VERSION:-latest}
    container_name: hanzo-team-fulltext
    environment:
      - SERVER_SECRET=${TEAM_SECRET:-team-secret-key}
      - DB_URL=mongodb://team-mongodb:27017
      - FULLTEXT_DB_URL=http://team-elastic:9200
      - ELASTIC_INDEX_NAME=hanzo_team_index
      - STORAGE_CONFIG=minio|team-minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - REKONI_URL=http://team-rekoni:4004
      - ACCOUNTS_URL=http://team-account:3000
      - STATS_URL=http://team-stats:4900
    depends_on:
      - team-elastic
      - team-account
    networks:
      - team-network
    restart: unless-stopped

  # Team - Elasticsearch for full-text search
  team-elastic:
    image: elasticsearch:7.14.2
    container_name: hanzo-team-elastic
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - http.cors.enabled=true
      - http.cors.allow-origin=*
    volumes:
      - team_elastic_data:/usr/share/elasticsearch/data
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    networks:
      - team-network
    restart: unless-stopped

  # Team - Rekoni OCR Service
  team-rekoni:
    image: hanzoai/team-rekoni:${TEAM_VERSION:-latest}
    container_name: hanzo-team-rekoni
    environment:
      - SECRET=${TEAM_SECRET:-team-secret-key}
    deploy:
      resources:
        limits:
          memory: 500M
    networks:
      - team-network
    restart: unless-stopped

  # Team - Stats Service
  team-stats:
    image: hanzoai/team-stats:${TEAM_VERSION:-latest}
    container_name: hanzo-team-stats
    environment:
      - PORT=4900
      - SERVER_SECRET=${TEAM_SECRET:-team-secret-key}
    networks:
      - team-network
    restart: unless-stopped

  # Team - Frontend
  team-front:
    image: hanzoai/team-front:${TEAM_VERSION:-latest}
    container_name: hanzo-team-front
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${TEAM_SECRET:-team-secret-key}
      - LOVE_ENDPOINT=http://localhost:${TEAM_PORT:-8087}/_love
      - ACCOUNTS_URL=http://localhost:${TEAM_PORT:-8087}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://team-account:3000
      - REKONI_URL=http://localhost:${TEAM_PORT:-8087}/_rekoni
      - GMAIL_URL=
      - CALENDAR_URL=
      - TELEGRAM_URL=
      - STATS_URL=http://localhost:${TEAM_PORT:-8087}/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://team-elastic:9200
      - COLLABORATOR_URL=ws://localhost:${TEAM_PORT:-8087}/_collaborator
      - STORAGE_CONFIG=minio|team-minio?accessKey=${MINIO_ROOT_USER:-minioadmin}&secretKey=${MINIO_ROOT_PASSWORD:-minioadmin}
      - DB_URL=mongodb://team-mongodb:27017
      - MONGO_URL=mongodb://team-mongodb:27017
      - TITLE=Hanzo Team
      - DEFAULT_LANGUAGE=en
      - LAST_NAME_FIRST=${TEAM_LAST_NAME_FIRST:-false}
      - BRANDING_URL=/branding.json
      - PROCEED_V7_MONGO=true
    depends_on:
      - team-account
      - team-transactor
      - team-collaborator
    networks:
      - team-network
    restart: unless-stopped

  # Team - Nginx Reverse Proxy
  team-nginx:
    image: nginx:1.25-alpine
    container_name: hanzo-team-nginx
    ports:
      - "${TEAM_PORT:-8087}:80"
    volumes:
      - ../../nginx/team.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - team-front
      - team-account
      - team-collaborator
      - team-rekoni
      - team-stats
    networks:
      - team-network
    restart: unless-stopped

volumes:
  team_mongodb_data:
  team_minio_data:
  team_elastic_data:
  team_redpanda_data:

networks:
  team-network:
    driver: bridge
