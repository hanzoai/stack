version: '3.8'

services:
  api:
    image: ghcr.io/hanzoai/api:latest
    container_name: hanzo-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://hanzo:hanzo123@postgres:5432/hanzo}
      - REDIS_URL=${REDIS_URL:-redis://:hanzo123@redis:6379}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_USE_SSL=false
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    networks:
      - hanzo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5