
services:
  app-builder:
    image: ghcr.io/hanzoai/app-builder:latest
    container_name: hanzo-app-builder
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://hanzo:hanzo123@postgres:5432/hanzo}
      - REDIS_URL=${REDIS_URL:-redis://:hanzo123@redis:6379}
      - NEXTAUTH_URL=http://localhost:3002
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - PORT=3002
    ports:
      - "3002:3002"
    networks:
      - hanzo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
