
services:
  cloud:
    image: ghcr.io/hanzoai/cloud:1.783.1
    container_name: hanzo-cloud
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://hanzo:hanzo123@postgres:5432/hanzo}
      - DATASTORE_HOST=datastore
      - DATASTORE_PORT=8123
      - DATASTORE_USER=${DATASTORE_USER}
      - DATASTORE_PASSWORD=${DATASTORE_PASSWORD}
      - DATASTORE_DB=${DATASTORE_DB}
      - REDIS_URL=${REDIS_URL:-redis://:hanzo123@redis:6379}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - PORT=3000
    ports:
      - "3000:3000"
    networks:
      - hanzo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      datastore:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5