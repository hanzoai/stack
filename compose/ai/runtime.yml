services:
  # Hanzo Runtime API - Code Execution Engine
  runtime:
    build:
      context: ${RUNTIME_PATH:-../runtime}
      dockerfile: Dockerfile
    image: hanzo/runtime:${VERSION:-latest}
    container_name: hanzo-runtime
    restart: unless-stopped
    ports:
      - "${RUNTIME_PORT:-3003}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      APP_URL: ${RUNTIME_URL:-http://localhost:3003}
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:-hanzo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hanzo123}
      DB_DATABASE: ${RUNTIME_DB:-hanzo_runtime}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-hanzo123}
      
      # Auth (using local dev mode)
      OIDC_CLIENT_ID: ${RUNTIME_OIDC_CLIENT_ID:-runtime-client}
      OIDC_ISSUER_BASE_URL: ${OIDC_ISSUER_URL:-http://localhost:8000}
      OIDC_AUDIENCE: ${RUNTIME_OIDC_AUDIENCE:-runtime-api}
      
      # S3 Storage
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_DEFAULT_BUCKET: ${RUNTIME_BUCKET:-runtime-storage}
      
      # Skip external connections in local dev
      SKIP_CONNECTIONS: ${SKIP_CONNECTIONS:-true}
      
      # Local development runner
      RUNNER_DOMAIN: ${RUNNER_DOMAIN:-localtest.me:3003}
      RUNNER_API_KEY: ${RUNNER_API_KEY:-secret_api_token}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - runtime_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  # Development Runtime Mock (lightweight alternative)
  runtime-mock:
    profiles: ["mock"]
    image: node:20-alpine
    container_name: hanzo-runtime-mock
    restart: unless-stopped
    ports:
      - "${RUNTIME_PORT:-3003}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
    volumes:
      - ./runtime-mock.js:/app/server.js:ro
    command: ["node", "/app/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

volumes:
  runtime_data:

networks:
  hanzo-network:
    external: true