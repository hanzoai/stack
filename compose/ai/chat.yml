
services:
  chat:
    image: ghcr.io/hanzoai/chat:latest
    container_name: hanzo-chat
    restart: unless-stopped
    environment:
      - DATABASE_URL=mongodb://hanzo:hanzo123@mongodb:27017/chat?authSource=admin
      - REDIS_URL=redis://:hanzo123@redis:6379
      - LLM_GATEWAY_URL=http://llm-gateway:4000
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - NEXTAUTH_URL=http://localhost:3081
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - PORT=3081
      - NODE_ENV=production
    ports:
      - "3081:3081"
    networks:
      - hanzo
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5