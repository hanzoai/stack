# LibreChat Configuration for Hanzo AI
version: 1.2.0

appTitle: "Hanzo AI Chat"
welcomeTitle: "Welcome to Hanzo AI Chat"
welcomeMessage: "Powered by Hanzo AI infrastructure"

endpoints:
  custom:
    - name: "Hanzo Router"
      apiKey: "${OPENAI_API_KEY}"
      baseURL: "http://hanzo-router:4000/v1"
      models:
        default: ["*"]
        fetch: true
      titleConvo: true
      titleModel: "gpt-4o-mini"
      summarize: false
      summaryModel: "gpt-4o-mini"
      forcePrompt: false
      modelDisplayLabel: "Hanzo Router"