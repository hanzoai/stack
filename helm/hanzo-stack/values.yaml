# Hanzo Stack — deploy on any Kubernetes cluster
# Usage:
#   helm dependency build
#   helm install hanzo . -n hanzo --create-namespace
#
# For production:
#   helm install hanzo . -n hanzo --create-namespace \
#     --set global.domain=yourdomain.com \
#     --set postgresql.auth.password=STRONG_PASSWORD \
#     --set redis.auth.password=STRONG_PASSWORD \
#     --set mongodb.auth.rootPassword=STRONG_PASSWORD \
#     --set llm.env.masterKey=sk-YOUR-MASTER-KEY

global:
  storageClass: ""  # Uses cluster default
  domain: "hanzo.local"
  imageRegistry: ghcr.io/hanzoai

# ─── Infrastructure ───────────────────────────────────────────────────────────

postgresql:
  enabled: true
  auth:
    username: hanzo
    password: ""  # REQUIRED: set via --set
    database: hanzo
  primary:
    persistence:
      enabled: true
      size: 10Gi

redis:
  enabled: true
  auth:
    enabled: true
    password: ""  # REQUIRED: set via --set
  master:
    persistence:
      enabled: true
      size: 2Gi

mongodb:
  enabled: true
  auth:
    enabled: true
    rootPassword: ""  # REQUIRED: set via --set
    username: hanzo
    password: ""  # REQUIRED: set via --set
    database: hanzo
  persistence:
    enabled: true
    size: 10Gi

# ─── Core Services ────────────────────────────────────────────────────────────

iam:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/hanzoai/iam
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8000
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

kms:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/hanzoai/kms
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  secretsRef: ""  # K8s secret with ROOT_ENCRYPTION_KEY, AUTH_SECRET, DB_CONNECTION_URI, REDIS_URL
  env:
    siteUrl: ""  # Set to https://kms.yourdomain.com
    inviteOnlySignup: "true"
    telemetryEnabled: "false"
    # IAM (Casdoor) OIDC authentication — set casdoorEndpoint to enable
    casdoorEndpoint: ""  # e.g., http://iam.hanzo.svc or https://hanzo.id
    casdoorClientId: "kms-client"
    casdoorSecretRef: "kms-casdoor-credentials"  # K8s secret with clientSecret key
    casdoorOrganization: "hanzo"
    casdoorApplication: "app-kms"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# ─── AI Services ──────────────────────────────────────────────────────────────

llm:
  enabled: true
  image:
    repository: ghcr.io/hanzoai/llm
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 4000
  env:
    masterKey: ""  # REQUIRED: set via --set
    # Provider API keys — set at least one
    openaiApiKey: ""
    anthropicApiKey: ""
    togetherApiKey: ""
    googleApiKey: ""
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: 1000m

cloud:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/hanzoai/cloud
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8000
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 4Gi

chat:
  enabled: true
  image:
    repository: ghcr.io/hanzoai/chat
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3081
  env:
    nodeEnv: production
    brandMode: "true"
    brandName: "Hanzo AI"
    appTitle: "Hanzo AI Chat"
    defaultTheme: "dark"
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 2Gi
      cpu: 1000m

console:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/hanzoai/console-web
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ─── Optional Services ────────────────────────────────────────────────────────

search:
  enabled: false
  image:
    repository: ghcr.io/hanzoai/search
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000

commerce:
  enabled: false
  replicaCount: 2
  image:
    repository: ghcr.io/hanzoai/commerce
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8000

analytics:
  enabled: false
  replicaCount: 2
  image:
    repository: ghcr.io/hanzoai/analytics
    tag: latest
    pullPolicy: Always

# ─── Ingress ──────────────────────────────────────────────────────────────────

ingress:
  enabled: true
  className: ""  # Set to your ingress class (e.g., ingress, nginx, traefik)
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
