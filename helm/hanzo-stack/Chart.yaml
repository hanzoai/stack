apiVersion: v2
name: hanzo-stack
description: |
  Complete Hanzo AI Infrastructure Stack.
  Deploy the full Hanzo platform on any Kubernetes cluster with a single chart.
  Includes IAM, KMS, LLM gateway, chat, cloud API, console, and all dependencies.
type: application
version: 0.2.0
appVersion: "1.0"
keywords:
  - hanzo
  - ai
  - llm
  - chat
  - infrastructure
  - iam
  - kms
  - gateway
home: https://hanzo.ai
sources:
  - https://github.com/hanzoai/hanzo
maintainers:
  - name: Hanzo AI
    email: dev@hanzo.ai
dependencies:
  - name: postgresql
    version: "13.2.24"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.11.1"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: mongodb
    version: "14.6.1"
    repository: "https://charts.bitnami.com/bitnami"
    condition: mongodb.enabled
