apiVersion: v2
name: hanzo-stack
description: Complete Hanzo AI Infrastructure Stack
type: application
version: 0.1.0
appVersion: "1.0"
keywords:
  - hanzo
  - ai
  - llm
  - chat
  - infrastructure
home: https://hanzo.ai
sources:
  - https://github.com/hanzoai/hanzo
maintainers:
  - name: Hanzo AI Team
    email: team@hanzo.ai
dependencies:
  - name: postgresql
    version: "13.2.24"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "18.11.1"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: mongodb
    version: "14.6.1"
    repository: "https://charts.bitnami.com/bitnami"
    condition: mongodb.enabled
  - name: minio
    version: "12.10.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: minio.enabled