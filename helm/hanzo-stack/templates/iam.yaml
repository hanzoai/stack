{{- if .Values.iam.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  labels:
    {{- include "hanzo-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: iam
spec:
  replicas: {{ .Values.iam.replicaCount | default 2 }}
  strategy:
    {{- toYaml (.Values.iam.strategy | default (dict "type" "RollingUpdate" "rollingUpdate" (dict "maxSurge" 1 "maxUnavailable" 0))) | nindent 4 }}
  selector:
    matchLabels:
      app: iam
  template:
    metadata:
      labels:
        app: iam
        app.kubernetes.io/component: iam
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["iam"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: iam
          image: "{{ .Values.iam.image.repository }}:{{ .Values.iam.image.tag }}"
          imagePullPolicy: {{ .Values.iam.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.iam.service.port }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.iam.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: iam
  labels:
    {{- include "hanzo-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: iam
spec:
  type: {{ .Values.iam.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.iam.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: iam
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: iam-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: iam
{{- end }}
