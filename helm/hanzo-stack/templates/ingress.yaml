{{- if .Values.ingress.enabled }}
{{- $domain := .Values.global.domain }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hanzo-stack
  labels:
    {{- include "hanzo-stack.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: hanzo-stack-tls
      hosts:
        {{- if .Values.iam.enabled }}
        - {{ $domain }}
        {{- end }}
        {{- if .Values.kms.enabled }}
        - kms.{{ $domain }}
        {{- end }}
        {{- if .Values.llm.enabled }}
        - api.{{ $domain }}
        {{- end }}
        {{- if .Values.cloud.enabled }}
        - cloud.{{ $domain }}
        {{- end }}
        {{- if .Values.chat.enabled }}
        - chat.{{ $domain }}
        {{- end }}
        {{- if .Values.console.enabled }}
        - console.{{ $domain }}
        {{- end }}
  {{- end }}
  rules:
    {{- if .Values.iam.enabled }}
    - host: {{ $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iam
                port:
                  number: {{ .Values.iam.service.port }}
    {{- end }}
    {{- if .Values.kms.enabled }}
    - host: kms.{{ $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kms
                port:
                  number: {{ .Values.kms.service.port }}
    {{- end }}
    {{- if .Values.llm.enabled }}
    - host: api.{{ $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: llm-gateway
                port:
                  number: {{ .Values.llm.service.port }}
    {{- end }}
    {{- if .Values.cloud.enabled }}
    - host: cloud.{{ $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-api
                port:
                  number: {{ .Values.cloud.service.port }}
    {{- end }}
    {{- if .Values.chat.enabled }}
    - host: chat.{{ $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chat
                port:
                  number: {{ .Values.chat.service.port }}
    {{- end }}
    {{- if .Values.console.enabled }}
    - host: console.{{ $domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: console
                port:
                  number: {{ .Values.console.service.port }}
    {{- end }}
{{- end }}
