{{- if .Values.kms.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kms
  labels:
    {{- include "hanzo-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: kms
spec:
  replicas: {{ .Values.kms.replicaCount | default 2 }}
  strategy:
    {{- toYaml (.Values.kms.strategy | default (dict "type" "RollingUpdate" "rollingUpdate" (dict "maxSurge" 1 "maxUnavailable" 0))) | nindent 4 }}
  selector:
    matchLabels:
      app: kms
  template:
    metadata:
      labels:
        app: kms
        app.kubernetes.io/component: kms
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: ["kms"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: kms
          image: "{{ .Values.kms.image.repository }}:{{ .Values.kms.image.tag }}"
          imagePullPolicy: {{ .Values.kms.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.kms.service.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: SITE_URL
              value: {{ .Values.kms.env.siteUrl | default (printf "https://kms.%s" .Values.global.domain) | quote }}
            - name: INVITE_ONLY_SIGNUP
              value: {{ .Values.kms.env.inviteOnlySignup | default "true" | quote }}
            - name: TELEMETRY_ENABLED
              value: {{ .Values.kms.env.telemetryEnabled | default "false" | quote }}
            {{- if .Values.kms.env.casdoorEndpoint }}
            - name: CASDOOR_ENDPOINT
              value: {{ .Values.kms.env.casdoorEndpoint | quote }}
            - name: CASDOOR_CLIENT_ID
              value: {{ .Values.kms.env.casdoorClientId | default "kms-client" | quote }}
            - name: CASDOOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.env.casdoorSecretRef | default "kms-casdoor-credentials" }}
                  key: clientSecret
            - name: CASDOOR_ORGANIZATION
              value: {{ .Values.kms.env.casdoorOrganization | default "hanzo" | quote }}
            - name: CASDOOR_APPLICATION
              value: {{ .Values.kms.env.casdoorApplication | default "app-kms" | quote }}
            {{- end }}
            {{- if .Values.kms.secretsRef }}
            - name: ROOT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.secretsRef }}
                  key: ROOT_ENCRYPTION_KEY
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.secretsRef }}
                  key: AUTH_SECRET
            - name: DB_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.secretsRef }}
                  key: DB_CONNECTION_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.secretsRef }}
                  key: REDIS_URL
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.kms.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kms
  labels:
    {{- include "hanzo-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: kms
spec:
  type: {{ .Values.kms.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.kms.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: kms
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kms-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kms
{{- end }}
