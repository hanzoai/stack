{{- if .Values.chat.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels:
    {{- include "hanzo-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
spec:
  replicas: {{ .Values.chat.replicaCount | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
        app.kubernetes.io/component: chat
    spec:
      containers:
        - name: chat
          image: "{{ .Values.chat.image.repository }}:{{ .Values.chat.image.tag }}"
          imagePullPolicy: {{ .Values.chat.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.chat.service.port }}
          env:
            - name: NODE_ENV
              value: {{ .Values.chat.env.nodeEnv | default "production" | quote }}
            - name: BRAND_MODE
              value: {{ .Values.chat.env.brandMode | default "true" | quote }}
            - name: BRAND_NAME
              value: {{ .Values.chat.env.brandName | default "Hanzo AI" | quote }}
            - name: APP_TITLE
              value: {{ .Values.chat.env.appTitle | default "Hanzo AI Chat" | quote }}
            - name: DEFAULT_THEME
              value: {{ .Values.chat.env.defaultTheme | default "dark" | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.chat.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: chat
  labels:
    {{- include "hanzo-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: chat
spec:
  type: {{ .Values.chat.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.chat.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: chat
{{- end }}
