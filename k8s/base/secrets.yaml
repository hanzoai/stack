apiVersion: v1
kind: Secret
metadata:
  name: hanzo-secrets
  namespace: hanzo
type: Opaque
stringData:
  # Database credentials
  postgres-user: hanzo
  postgres-password: changeme-strong-password
  redis-password: changeme-strong-password
  mongodb-username: hanzo
  mongodb-password: changeme-strong-password
  
  # MinIO credentials
  minio-root-user: minioadmin
  minio-root-password: changeme-strong-password
  
  # Meilisearch
  meilisearch-master-key: changeme-strong-password
  
  # LLM Router
  router-master-key: sk-router-changeme-strong-key
  
  # Auth
  nextauth-secret: changeme-random-secret-string
  
  # LLM Providers (add your keys here)
  openai-api-key: ""
  anthropic-api-key: ""
  together-api-key: ""
  google-api-key: ""