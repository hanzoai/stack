# Hanzo Stack - Production Compose
# Uses pre-built images from Docker Hub / GitHub Container Registry

services:
  # Core Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: hanzo-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hanzo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hanzo123}
      - POSTGRES_DB=${POSTGRES_DB:-hanzo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hanzo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  redis:
    image: redis:7-alpine
    container_name: hanzo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-hanzo123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hanzo123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  mongodb:
    image: mongo:7
    container_name: hanzo-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-hanzo}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-hanzo123}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-hanzo}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  minio:
    image: minio/minio:latest
    container_name: hanzo-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: hanzo-meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-hanzo-meili-master}
      - MEILI_ENV=${MEILI_ENV:-development}
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  # Hanzo Router (LLM Gateway) - Using local Hanzo router
  router:
    image: ghcr.io/hanzoai/llm:latest
    container_name: hanzo-router
    ports:
      - "${ROUTER_PORT:-4000}:4000"
    environment:
      - ROUTER_MASTER_KEY=${ROUTER_MASTER_KEY:-sk-router-master-hanzo}
      - ROUTER_MODE=${ROUTER_MODE:-PRODUCTION}
      - UI_USERNAME=${ROUTER_UI_USERNAME:-admin}
      - UI_PASSWORD=${ROUTER_UI_PASSWORD:-admin}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/${POSTGRES_DB:-hanzo}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-hanzo123}@redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
    volumes:
      - ./config/router-config-hanzo.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:4000/health/liveliness').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hanzo-network

  # Hanzo Chat - AI Chat Platform
  chat:
    image: ghcr.io/hanzoai/chat:latest
    container_name: hanzo-chat
    ports:
      - "${CHAT_PORT:-3081}:3080"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:-hanzo}:${MONGO_ROOT_PASSWORD:-hanzo123}@mongodb:27017/LibreChat?authSource=admin
      - REDIS_URI=redis://:${REDIS_PASSWORD:-hanzo123}@redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ENDPOINTS=openAI,anthropic,azureOpenAI,google
      - PROXY=http://router:4000/v1
      - TITLE=Hanzo Chat
      - CUSTOM_FOOTER="Powered by Hanzo AI"
      - ALLOW_REGISTRATION=true
      - JWT_SECRET=${JWT_SECRET:-hanzo-chat-secret-key-change-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-hanzo-chat-refresh-secret-key-change-in-production}
      - CREDS_KEY=${CREDS_KEY:-hanzo-creds-key-change-in-production}
      - CREDS_IV=${CREDS_IV:-hanzo-creds-iv-change-in-production}
    volumes:
      - chat_uploads:/app/client/public/uploads
      - chat_logs:/app/logs
      - ./configs/librechat.yaml:/app/librechat.yaml:ro
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3080/api/health', res => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

