  # Hanzo Analytics - Privacy-focused analytics platform
  analytics:
    build:
      context: ../analytics
      dockerfile: Dockerfile
    container_name: hanzo-analytics
    ports:
      - "${ANALYTICS_PORT:-3090}:3000"
    environment:
      - DATABASE_URL=${ANALYTICS_DATABASE_URL:-postgresql://analytics:analytics123@postgres:5432/analytics}
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${ANALYTICS_SECRET:-hanzo-analytics-secret-key-change-in-production}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-hanzo123}@redis:6379
      - DISABLE_BOT_CHECK=${ANALYTICS_DISABLE_BOT_CHECK:-false}
      - DISABLE_LOGIN=${ANALYTICS_DISABLE_LOGIN:-false}
      - DISABLE_UI=${ANALYTICS_DISABLE_UI:-false}
      - PRIVATE_MODE=${ANALYTICS_PRIVATE_MODE:-false}
      - CLOUD_MODE=${ANALYTICS_CLOUD_MODE:-false}
      - DEFAULT_LOCALE=${ANALYTICS_LOCALE:-en-US}
      - TRACKER_SCRIPT_NAME=${ANALYTICS_TRACKER_SCRIPT:-hanzo.js}
      - COLLECT_API_ENDPOINT=${ANALYTICS_COLLECT_ENDPOINT:-/api/send}
      - HOSTNAME=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  # Nginx Reverse Proxy with Analytics Integration
  nginx:
    image: nginx:alpine
    container_name: hanzo-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/chat-analytics.conf:/etc/nginx/conf.d/chat.conf:ro
      - ./nginx/ide-analytics.conf:/etc/nginx/conf.d/ide.conf:ro
    depends_on:
      - chat
      - ide
      - analytics
    networks:
      - hanzo-network

