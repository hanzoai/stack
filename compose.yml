  # Hanzo Runtime - AI Agent Runtime (Mock for now)
  runtime:
    build:
      context: ./runtime
      dockerfile: Dockerfile
    container_name: hanzo-runtime
    environment:
      - NODE_ENV=production
      - PORT=8002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/runtime
      - REDIS_URL=redis://:${REDIS_PASSWORD:-hanzo123}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-hanzo-runtime-secret}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "${RUNTIME_PORT:-8002}:8002"
    volumes:
      - runtime_data:/app/data
      - runtime_sandboxes:/app/sandboxes
      - runtime_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hanzo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Hanzo IAM - Identity and Access Management (Mock for now)
  iam:
    build:
      context: ./iam
      dockerfile: Dockerfile
    container_name: hanzo-iam
    ports:
      - "${IAM_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/iam
      - RUNNING_IN_DOCKER=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hanzo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Volumes
volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  minio_data:
  meilisearch_data:
  chat_uploads:
  chat_logs:
  ide_workspace:
  ide_config:
  search_data:
  cloud_data:
  agent_data:
  flow_data:
  api_data:
  iam_data:
  runtime_data:
  runtime_sandboxes:
  runtime_logs:

# Network
networks:
  hanzo-network:
    name: hanzo-network
    external: true
