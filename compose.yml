# Hanzo Stack - Working Services Only
# Uses only services with available ghcr.io images

services:
  # Core Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: hanzo-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hanzo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-hanzo123}
      - POSTGRES_DB=${POSTGRES_DB:-hanzo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hanzo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  redis:
    image: redis:7-alpine
    container_name: hanzo-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-hanzo123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-hanzo123}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  mongodb:
    image: mongo:7
    container_name: hanzo-mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-hanzo}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-hanzo123}
      - MONGO_INITDB_DATABASE=${MONGO_DATABASE:-hanzo}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  minio:
    image: minio/minio:latest
    container_name: hanzo-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: hanzo-meilisearch
    environment:
      - MEILI_ENV=${MEILI_ENV:-development}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  # Hanzo Services with Available Images
  router:
    image: ghcr.io/hanzoai/router:latest
    container_name: hanzo-router
    ports:
      - "${ROUTER_PORT:-4000}:4000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/${POSTGRES_DB:-hanzo}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-hanzo123}@redis:6379
      - MASTER_KEY=${ROUTER_MASTER_KEY:-sk-router-master-hanzo}
      # LLM Provider Keys (from .env)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - VERTEX_PROJECT=${VERTEX_PROJECT}
      - VERTEX_LOCATION=${VERTEX_LOCATION}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - REPLICATE_API_KEY=${REPLICATE_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AZURE_API_KEY=${AZURE_API_KEY}
      - AZURE_API_BASE=${AZURE_API_BASE}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      # Router Configuration
      - LITELLM_MODE=PRODUCTION
      - DATABASE_SCHEMA_NAME=hanzo_router
      - STORE_MODEL_IN_DB=true
      - LITELLM_DROP_PARAMS=true
      - LITELLM_LOCAL_MODEL_COST_MAP=true
      - SET_VERBOSE=true
      - ACTIONS_SEED_ENABLED=true
      - UI_USERNAME=${ROUTER_UI_USERNAME:-admin}
      - UI_PASSWORD=${ROUTER_UI_PASSWORD:-admin}
      - CUSTOM_EXTENSIONS_PATH=/app/extensions.py
    volumes:
      - ./config/router-config.yaml:/app/config.yaml:ro
      - ./config/router-extensions.py:/app/extensions.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--telemetry", "False"]
    networks:
      - hanzo-network

  chat:
    image: ghcr.io/hanzoai/chat:latest
    container_name: hanzo-chat
    ports:
      - "${CHAT_PORT:-3081}:3080"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/${POSTGRES_DB:-hanzo}_chat
      - MONGO_URI=mongodb://${MONGO_USERNAME:-hanzo}:${MONGO_PASSWORD:-hanzo123}@mongodb:27017/${MONGO_DATABASE:-hanzo}?authSource=admin
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
      - ROUTER_URL=http://router:4000/v1
      - ALLOW_SOCIAL_LOGIN=false
      - CREDS_IV=${CREDS_IV}
      - CREDS_KEY=${CREDS_KEY}
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-refresh-secret}
      - DOMAIN_CLIENT=http://localhost:3081
      - DOMAIN_SERVER=http://localhost:3081
      - NO_INDEX=true
      - DEBUG_LOGGING=true
      - DEBUG_CONSOLE=true
      - SEARCH_ENABLED=false
      - REGISTRATION_ENABLED=true
      - CHECK_BALANCE=false
      - TITLE_CONVO=true
      - CUSTOM_FOOTER="Powered by Hanzo AI"
      - HELP_AND_FAQ_URL=https://hanzo.ai/help
      - SHOW_BIRTHDAY_ICON=false
      - ALLOW_MESSAGE_EDITING=true
      - ALLOW_MESSAGE_DELETION=true
      - ALLOW_UNVERIFIED_EMAIL_LOGIN=true
      - APP_TITLE=Hanzo Chat
      - ENDPOINTS=router
    volumes:
      - chat_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      router:
        condition: service_started
    networks:
      - hanzo-network

  analytics:
    image: ghcr.io/hanzoai/analytics:latest
    container_name: hanzo-analytics
    ports:
      - "${ANALYTICS_PORT:-3010}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hanzo}:${POSTGRES_PASSWORD:-hanzo123}@postgres:5432/${POSTGRES_DB:-hanzo}_analytics
      - NEXTAUTH_URL=http://localhost:3010
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-nextauth-secret}
      - DISABLE_SIGNUPS=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hanzo-network

  ide:
    image: ghcr.io/hanzoai/ide:latest
    container_name: hanzo-ide
    ports:
      - "${IDE_PORT:-3005}:3001"
    environment:
      - LLM_API_KEY=${ROUTER_MASTER_KEY:-sk-router-master-hanzo}
      - LLM_BASE_URL=http://router:4000
      - WORKSPACE_MOUNT_PATH=/workspace
      - SANDBOX_USER_ID=1000
      - USE_HOST_NETWORK=false
      - RUN_AS_OPENHANDS=true
      - RUNTIME_CONTAINER_IMAGE=ghcr.io/hanzoai/runtime:latest
      - SANDBOX_TYPE=exec
      - WORKSPACE_BASE=/workspace
      - MOUNT_WORKSPACE=true
      - MOUNT_CACHE=true
      - CACHE_DIR=/tmp/cache
      - BROWSERGYM_CDN=https://browser-use-api-experimental.netlify.app
      - INIT_PLUGINS=codeact,jupyter,swe_agent
    volumes:
      - ./workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      router:
        condition: service_started
    networks:
      - hanzo-network

  runtime:
    image: ghcr.io/hanzoai/runtime:latest
    container_name: hanzo-runtime
    ports:
      - "${RUNTIME_PORT:-3003}:8080"
    environment:
      - RUNTIME_CONTAINER_IMAGE=ghcr.io/hanzoai/runtime:latest
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - hanzo-network

  iam:
    image: ghcr.io/hanzoai/iam:latest
    container_name: hanzo-iam
    ports:
      - "${IAM_PORT:-8000}:8000"
    environment:
      - driverName=postgres
      - dataSourceName=user=${POSTGRES_USER:-hanzo} password=${POSTGRES_PASSWORD:-hanzo123} host=postgres port=5432 sslmode=disable dbname=${POSTGRES_DB:-hanzo}_iam
      - appname=Hanzo IAM
      - httpport=8000
      - runmode=dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hanzo-network

  # Nginx Proxy with Analytics
  nginx:
    image: nginx:alpine
    container_name: hanzo-nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - router
      - chat
      - analytics
      - ide
      - runtime
      - iam
    networks:
      - hanzo-network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  minio_data:
  meilisearch_data:
  chat_uploads:

networks:
  hanzo-network:
    driver: bridge