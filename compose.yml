  # Hanzo IDE - AI Development Assistant
  ide:
    build:
      context: ../ide
      dockerfile: app/dev/containers/app/Dockerfile
    container_name: hanzo-ide
    ports:
      - "${IDE_PORT:-3002}:3000"
    environment:
      - WORKSPACE_MOUNT_PATH=/workspace
      - SANDBOX_USER_ID=1000
      - USE_HOST_NETWORK=false
      - SSH_HOSTNAME=localhost
      - DISABLE_TELEM=true
      - LLM_API_KEY=sk-router-master-hanzo
      - LLM_BASE_URL=http://router:4000/v1
      - AGENT_MEMORY_ENABLED=true
      - FILE_STORE_PATH=/app/data
    volumes:
      - ide_workspace:/opt/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      # - ./config/ide-config.toml:/app/config.toml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hanzo-network

  # Hanzo Runtime - Code execution sandbox (temporarily disabled due to build issues)
