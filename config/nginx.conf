events {
    worker_connections 1024;
}

http {
    upstream router {
        server router:8000;
    }
    
    upstream chat {
        server chat:8080;
    }
    
    upstream ide {
        server ide:3000;
    }

    server {
        listen 80;
        
        location /router/ {
            proxy_pass http://router/;
        }
        
        location /chat/ {
            proxy_pass http://chat/;
        }
        
        location /ide/ {
            proxy_pass http://ide/;
        }
    }
}
