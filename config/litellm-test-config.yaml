# LiteLLM test configuration
model_list:
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: gpt-3.5-turbo
      mock_response: true
      
  - model_name: gpt-4
    litellm_params:
      model: gpt-4
      mock_response: true
      
  - model_name: claude-3-sonnet
